[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-to-vectors"
version = "1.0.0"
description = "Structure-aware chunking and hybrid BM25 + RRF retrieval for RAG. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aiplusplus360" }]
keywords = ["rag", "chunking", "retrieval", "bm25", "rrf", "embeddings", "markdown"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
docvec = "docvec.cli:main"

[project.urls]
Homepage = "https://github.com/aiplusplus360/doc-to-vectors"

[tool.setuptools]
packages = ["docvec"]
